[package]
name = "arthex"
version = "0.2.20"
description = "A fast overlay for shortcuts, search and everyday tools."
authors = ["arthreto"]
license-file = "../LICENSE"
repository = "https://github.com/arthreto/Arthex"
edition = "2024"
rust-version = "1.88"

[lib]
name = "arthex_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
memchr = "2"
notify = "8"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
tauri-plugin-updater = "2"
minisign-verify = "0.2"
semver = "1"
sha2 = "0.10"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
