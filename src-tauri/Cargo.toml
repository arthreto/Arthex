[package]
name = "arthex"
version = "0.1.0"
description = "A fast overlay for shortcuts, search and everyday tools."
authors = ["arthreto"]
license-file = "../LICENSE"
repository = "https://github.com/arthreto/Arthex"
edition = "2024"
rust-version = "1.85"

[lib]
name = "arthex_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
