[package]
name = "arthex-module"
version = "1.0.0"
description = "The side of an installable Arthex module that runs as its own program."
authors = ["arthreto"]
license-file = "../../LICENSE"
repository = "https://github.com/arthreto/Arthex"
edition = "2024"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
