name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            sdk/native
      - run: npm ci && npm run build
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: src-tauri
        run: cargo test --locked
      - working-directory: sdk/native
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci && npm run build
      - working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: src-tauri
        run: cargo test --locked
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: arthex-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Measure size and memory
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/arthex.exe
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $mb = { param($bytes) [math]::Round($bytes / 1MB, 1) }
          # Hidden in the tray as after a Windows start, then open on the first-launch screen, long
          # enough for the file index to scan the drive.
          $rows = foreach ($run in @(@{ Name = 'hidden'; Args = '--autostart'; Wait = 20 }, @{ Name = 'open'; Args = ''; Wait = 75 })) {
            $app = if ($run.Args) { Start-Process $exe.FullName -ArgumentList $run.Args -PassThru } else { Start-Process $exe.FullName -PassThru }
            Start-Sleep -Seconds $run.Wait
            $app.Refresh()
            $webview = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" |
              Where-Object { $_.CommandLine -match 'arthex' } |
              ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
            $webviewBytes = ($webview | Measure-Object WorkingSet64 -Sum).Sum
            $webviewPrivate = ($webview | Measure-Object PrivateMemorySize64 -Sum).Sum
            "| Memory $($run.Name): Arthex | $(& $mb $app.WorkingSet64) MB (private $(& $mb $app.PrivateMemorySize64) MB) |"
            "| Memory $($run.Name): WebView2, $($webview.Count) processes | $(& $mb $webviewBytes) MB (private $(& $mb $webviewPrivate) MB) |"
            "| CPU time $($run.Name), first $($run.Wait) s | $([math]::Round($app.TotalProcessorTime.TotalMilliseconds)) ms |"
            Stop-Process -Id $app.Id -Force
            Start-Sleep -Seconds 3
          }
          @(
            '| Measure | Value |'
            '| --- | --- |'
            "| Installer | $(& $mb $installer.Length) MB |"
            "| Installed program | $(& $mb $exe.Length) MB |"
          ) + $rows | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
