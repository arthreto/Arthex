name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version, the update key and the changelog
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            grep -q "\"version\": \"$version\"" "$file" || { echo "::error::$file is not at version $version"; exit 1; }
          done
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml || { echo "::error::src-tauri/Cargo.toml is not at version $version"; exit 1; }
          if grep -q '"pubkey": ""' src-tauri/tauri.conf.json; then
            echo "::error::Set the updater public key first, see docs/DEVELOPMENT.md → Releasing"
            exit 1
          fi
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          if ! grep -q '^### English' <<<"$notes" || ! grep -q '^### Français' <<<"$notes"; then
            echo "::error::The tag message must hold the changelog, see docs/DEVELOPMENT.md → Releasing"
            exit 1
          fi
          { echo 'body<<ARTHEX_NOTES'; echo "$notes"; echo 'ARTHEX_NOTES'; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Arthex ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
