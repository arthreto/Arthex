name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commits: this workflow handles the update signing key.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the version, the update key and the changelog
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            grep -q "\"version\": \"$version\"" "$file" || { echo "::error::$file is not at version $version"; exit 1; }
          done
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml || { echo "::error::src-tauri/Cargo.toml is not at version $version"; exit 1; }
          if grep -q '"pubkey": ""' src-tauri/tauri.conf.json; then
            echo "::error::Set the updater public key first, see docs/DEVELOPMENT.md → Releasing"
            exit 1
          fi
          # The body only: the subject line and any signature stay out of the notes.
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if ! grep -q '^### English' "$RUNNER_TEMP/notes.md" || ! grep -q '^### Français' "$RUNNER_TEMP/notes.md"; then
            echo "::error::The tag message must hold the changelog, see docs/DEVELOPMENT.md → Releasing"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Built without the signing key: dependencies and build scripts never see it.
      - run: npx tauri build --bundles nsis
      - name: Sign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          npx tauri signer sign "$installer"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
      - name: Publish the release with latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(basename "$INSTALLER")
          node -e '
            const fs = require("fs");
            const [installer, name, tag, notes] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version: tag.replace(/^v/, ""),
              notes: fs.readFileSync(notes, "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(installer + ".sig", "utf8").trim(),
                  url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}`,
                },
              },
            }, null, 2));
          ' "$INSTALLER" "$name" "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$INSTALLER" "$INSTALLER.sig" latest.json \
            --title "Arthex $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
